<!DOCTYPE html>

<html>
<head>
    <title>Verify OTP</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;600&display=swap" rel="stylesheet">

<style>
    body {
        font-family: 'Poppins', sans-serif;
        background: linear-gradient(135deg, #e3f2fd, #ffffff);
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        margin: 0;
    }

    .card {
        background: white;
        padding: 40px;
        border-radius: 15px;
        box-shadow: 0 10px 25px rgba(0,0,0,0.1);
        width: 320px;
        text-align: center;
        animation: fadeIn 0.4s ease-in-out;
    }

    @keyframes fadeIn {
        from { opacity: 0; transform: translateY(15px); }
        to { opacity: 1; transform: translateY(0); }
    }

    h2 {
        margin-bottom: 10px;
    }

    p {
        color: #666;
        font-size: 14px;
        margin-bottom: 20px;
    }

    .otp-input {
        width: 100%;
        padding: 14px;
        font-size: 18px;
        text-align: center;
        letter-spacing: 5px;
        border-radius: 10px;
        border: 1px solid #ccc;
        outline: none;
        margin-bottom: 20px;
    }

    .otp-input:focus {
        border-color: #4285f4;
        box-shadow: 0 0 5px rgba(66,133,244,0.4);
    }

    button {
        width: 100%;
        padding: 12px;
        background: #4285f4;
        color: white;
        border: none;
        border-radius: 10px;
        cursor: pointer;
        font-size: 16px;
    }

    button:hover {
        background: #3367d6;
    }

    .error {
        color: red;
        font-size: 13px;
        margin-top: 10px;
    }

    .icon {
        font-size: 40px;
        margin-bottom: 10px;
    }
</style>

</head>

<body>

<div class="card">
    <div class="icon">🔐</div>
    <h2>Verify Code</h2>
    <p>Enter the 6-digit code from your Authenticator app</p>

<form method="POST">
    <input type="text" name="otp" class="otp-input" maxlength="6" placeholder="••••••" required>
    <button type="submit">Verify</button>
</form>

{% with messages = get_flashed_messages() %}
    {% for msg in messages %}
        <p class="error">{{ msg }}</p>
    {% endfor %}
{% endwith %}

</div>

</body>
</html>
